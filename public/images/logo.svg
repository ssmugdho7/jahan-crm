<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- JC Monogram -->
  <g transform="translate(50, 50)">
    <!-- J letter -->
    <path d="M40 20 L40 120 Q40 160 20 160 L20 160 Q0 160 0 140" 
          stroke="url(#navyGrad)" stroke-width="28" fill="none" stroke-linecap="round"/>
    
    <!-- C letter with bar chart -->
    <path d="M120 50 Q80 50 60 80 L60 130 Q80 160 120 160" 
          stroke="url(#blueGrad)" stroke-width="24" fill="none" stroke-linecap="round"/>
    
    <!-- Bar chart inside C -->
    <rect x="85" y="100" width="8" height="40" fill="url(#blueGrad)" rx="2"/>
    <rect x="100" y="80" width="8" height="60" fill="url(#blueGrad)" rx="2"/>
    <rect x="115" y="60" width="8" height="80" fill="url(#blueGrad)" rx="2"/>
  </g>
  
  <!-- Jahan CRM Text -->
  <text x="280" y="140" font-family="Arial, sans-serif" font-size="72" font-weight="bold">
    <tspan fill="#0f172a">Jahan </tspan>
    <tspan fill="#2563eb">CRM</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="280" y="190" font-family="Arial, sans-serif" font-size="24" fill="#64748b" letter-spacing="8">
    MANAGE. TRACK. GROW.
  </text>
</svg>
