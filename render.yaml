databases:
  - name: jahan-crm-db
    plan: free
    databaseName: jahan-crm
    ipAllowList: []

services:
  - type: web
    name: jahan-crm
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    preDeployCommand: php artisan migrate --force
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://jahan-crm.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: jahan-crm-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: jahan-crm-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: jahan-crm-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: jahan-crm-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jahan-crm-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: SESSION_ENCRYPT
        value: "false"
      - key: SESSION_PATH
        value: "/"
      - key: SESSION_DOMAIN
        value: "null"
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: local
